name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt

    - name: Run Hermetic Regression Tests
      env:
        SECRET_KEY: ci-test-secret-key-32-characters-long
        ADMIN_EMAIL: admin@example.com
        ADMIN_PASSWORD_HASH: scrypt:32768:8:1$dummyhash
        AUTO_APPROVAL_ENABLED: "false"
      run: |
        python scripts/test_local.py

    - uses: actions/setup-node@v4
      with:
        node-version: "24"

    - name: Test PostgreSQL migrations in isolation
      run: |
        npm install --prefix "$RUNNER_TEMP/migration-tests" @electric-sql/pglite@0.5.8
        node tests/migrations/activation_recovery_admin.mjs "$RUNNER_TEMP/migration-tests" supabase/migrations/20261009155342_premium_two_code_capacity.sql
        node tests/migrations/inventory_jobs.mjs "$RUNNER_TEMP/migration-tests"
